version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  # Every change enters through Develop; main only receives releases.
  target-branch: Develop
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  # One weekly PR for minor and patch updates; major versions still arrive one by one.
  groups:
    bundler-minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  target-branch: Develop
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    actions-minor-and-patch:
      update-types:
      - minor
      - patch
